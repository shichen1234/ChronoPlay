<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>扩展程序</title>
  <style>
    body {
      background-color: #0b0b0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      padding-top: 60px; /* Leave space for injected nav bar */
      box-sizing: border-box;
      overflow-y: auto;
      height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #3a3a3a;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      color: #66c0f4;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: #171a21;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 160px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #386080;
    }
    .card-top {
      display: flex;
      gap: 14px;
    }
    .icon {
      font-size: 32px;
      background: rgba(102, 192, 244, 0.1);
      border-radius: 8px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .version {
      font-size: 11px;
      color: #888;
      background: rgba(255,255,255,0.06);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .desc {
      font-size: 12px;
      color: #a0a0a0;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
      margin-top: 12px;
    }
    .ext-id {
      font-size: 10px;
      color: #66c0f4;
      font-family: monospace;
      opacity: 0.8;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-label {
      font-size: 11px;
      color: #2ecc71;
      font-weight: bold;
    }
    .no-extensions {
      text-align: center;
      color: #888;
      padding: 40px;
      grid-column: 1 / -1;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🧩</span>
    <h1>已安装的扩展程序</h1>
  </div>
  
  <div class="grid" id="extensions-grid">
    <div class="no-extensions">正在获取已挂载的浏览器扩展...</div>
  </div>

  <script>
    window.setExtensions = function(list) {
      const grid = document.getElementById('extensions-grid');
      grid.innerHTML = '';
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="no-extensions">未检测到已挂载的扩展程序</div>';
        return;
      }
      list.forEach(ext => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <div class="icon">🧩</div>
            <div class="info">
              <div class="name-row">
                <span class="name" title="${ext.name}">${ext.name}</span>
                <span class="version">v${ext.version}</span>
              </div>
              <span class="desc" title="${ext.description || ''}">${ext.description || '暂无描述信息'}</span>
            </div>
          </div>
          <div class="card-bottom">
            <span class="ext-id">ID: ${ext.id}</span>
            <div class="toggle-row">
              <span class="toggle-label">已启用</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    };
  </script>
</body>
</html>
