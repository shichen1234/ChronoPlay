<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoPlay 复古街机模拟器</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
    *, *::before, *::after, img, a, canvas, div, span, button {
      -webkit-user-drag: none !important;
      user-drag: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // 拦截内嵌模拟器页面的所有拖动行为
    window.addEventListener('dragstart', (e) => {
      e.preventDefault();
      return false;
    }, true);
    // 解析 URL 参数，获取 Rom 文件路径、模拟器核心和可选的 BIOS
    const params = new URLSearchParams(window.location.search);
    const game = params.get('game') || 'dino.zip';
    const core = params.get('core') || 'fbneo';
    const bios = params.get('bios'); // 新增: 获取 BIOS 文件名参数，例如 neogeo.zip

    window.EJS_player = '#game-container';
    window.EJS_core = core;
    window.EJS_gameUrl = '/' + game;
    window.EJS_pathtodata = '/emulatorjs/';
    window.EJS_startOnLoaded = true; // 资源加载完成后自动运行游戏
    if (bios) {
      window.EJS_biosUrl = '/' + bios; // 配置 BIOS 文件路径
    }

    // 性能优化配置：启用 WebGL 硬件加速，禁用画面过滤以大幅提升帧率
    window.EJS_webgl = true;
    window.EJS_smooth = false;
    window.EJS_threads = false;

    // 禁用本地存储与 IndexedDB 缓存，并阻止解压 BIOS（FBNeo 核心要求 neogeo.zip 必须保持压缩包状态）
    window.EJS_disableLocalStorage = true;
    window.EJS_disableDatabases = true;
    window.EJS_dontExtractBIOS = true;

    // 根据不同游戏配置独立的 1P/2P 默认键位映射
    const gameLower = game.toLowerCase();
    
    if (gameLower.includes('pokemon') || gameLower.includes('gba') || gameLower.includes('zelda') || gameLower.includes('kirby') || core === 'mgba') {
      // 精灵宝可梦 / 塞尔达 / 卡比 / GBA 独占自定义键位：
      // J 映射为 GBA B 键 (攻击/挥剑/吸入攻击)
      // K 映射为 GBA A 键 (跳跃/防御/盾牌/对话确认)
      // U 映射为 L 肩键，I 映射为 R 肩键，Shift 为 Select，Enter 为 Start
      window.EJS_defaultControls = {
        0: { // 玩家 1 (1P)
          4: { 'value': 'w', 'value2': 'DPAD_UP' }, // D-pad 上
          5: { 'value': 's', 'value2': 'DPAD_DOWN' }, // D-pad 下
          6: { 'value': 'a', 'value2': 'DPAD_LEFT' }, // D-pad 左
          7: { 'value': 'd', 'value2': 'DPAD_RIGHT' }, // D-pad 右
          2: { 'value': 'shift', 'value2': 'LEFT_BOTTOM_SHOULDER' }, // Select 键
          3: { 'value': 'enter', 'value2': 'RIGHT_BOTTOM_SHOULDER' }, // Start 键
          0: { 'value': 'j', 'value2': 'BUTTON_2' }, // B 键 (J 键: 攻击/挥剑/吸入)
          8: { 'value': 'k', 'value2': 'BUTTON_1' }, // A 键 (K 键: 跳跃/盾牌/确认)
          10: { 'value': 'u', 'value2': 'LEFT_TOP_SHOULDER' }, // L 键 (U 键)
          11: { 'value': 'i', 'value2': 'RIGHT_TOP_SHOULDER' }, // R 键 (I 键)
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        1: { // 玩家 2 (2P)
          4: { 'value': 'i', 'value2': 'DPAD_UP' },
          5: { 'value': 'm', 'value2': 'DPAD_DOWN' },
          6: { 'value': 'u', 'value2': 'DPAD_LEFT' },
          7: { 'value': 'o', 'value2': 'DPAD_RIGHT' },
          2: { 'value': 'y', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          3: { 'value': 'p', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          8: { 'value': 'z', 'value2': 'BUTTON_1' }, // A 键
          0: { 'value': 'x', 'value2': 'BUTTON_2' }, // B 键
          10: { 'value': '', 'value2': 'LEFT_TOP_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_TOP_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        2: {},
        3: {}
      };
    } else if (gameLower.includes('kof97') || gameLower.includes('kof98')) {
      // 拳皇 '97 键位配置
      window.EJS_defaultControls = {
        0: { // 玩家 1 (1P)
          4: { 'value': 'w', 'value2': 'DPAD_UP' }, // D-pad 上
          5: { 'value': 's', 'value2': 'DPAD_DOWN' }, // D-pad 下
          6: { 'value': 'a', 'value2': 'DPAD_LEFT' }, // D-pad 左
          7: { 'value': 'd', 'value2': 'DPAD_RIGHT' }, // D-pad 右
          2: { 'value': 'shift', 'value2': 'LEFT_TOP_SHOULDER' }, // 投币映射为肩键 LB/L1 避开主页键
          3: { 'value': 'enter', 'value2': 'RIGHT_TOP_SHOULDER' }, // 开始映射为肩键 RB/R1
          0: { 'value': 'u', 'value2': 'BUTTON_3' }, // A (轻拳, Xbox X)
          8: { 'value': 'i', 'value2': 'BUTTON_1' }, // B (轻脚, Xbox A)
          1: { 'value': 'j', 'value2': 'BUTTON_4' }, // C (重拳, Xbox Y)
          9: { 'value': 'k', 'value2': 'BUTTON_2' }, // D (重脚, Xbox B)
          10: { 'value': '', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        1: { // 玩家 2 (2P)
          4: { 'value': 'i', 'value2': 'DPAD_UP' },
          5: { 'value': 'm', 'value2': 'DPAD_DOWN' },
          6: { 'value': 'u', 'value2': 'DPAD_LEFT' },
          7: { 'value': 'o', 'value2': 'DPAD_RIGHT' },
          2: { 'value': 'y', 'value2': 'LEFT_TOP_SHOULDER' }, // 投币
          3: { 'value': 'p', 'value2': 'RIGHT_TOP_SHOULDER' }, // 开始
          0: { 'value': 'z', 'value2': 'BUTTON_3' }, // A (轻拳, Xbox X)
          8: { 'value': 'x', 'value2': 'BUTTON_1' }, // B (轻脚, Xbox A)
          1: { 'value': 'c', 'value2': 'BUTTON_4' }, // C (重拳, Xbox Y)
          9: { 'value': 'v', 'value2': 'BUTTON_2' }, // D (重脚, Xbox B)
          10: { 'value': '', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        2: {},
        3: {}
      };
    } else if (gameLower.includes('mslug')) {
      // 合金弹头 键位配置
      window.EJS_defaultControls = {
        0: { // 玩家 1 (1P)
          4: { 'value': 'w', 'value2': 'DPAD_UP' }, // D-pad 上
          5: { 'value': 's', 'value2': 'DPAD_DOWN' }, // D-pad 下
          6: { 'value': 'a', 'value2': 'DPAD_LEFT' }, // D-pad 左
          7: { 'value': 'd', 'value2': 'DPAD_RIGHT' }, // D-pad 右
          2: { 'value': 'shift', 'value2': 'LEFT_TOP_SHOULDER' }, // 投币映射为肩键 LB/L1
          3: { 'value': 'enter', 'value2': 'RIGHT_TOP_SHOULDER' }, // 开始映射为肩键 RB/R1
          0: { 'value': 'j', 'value2': 'BUTTON_3' }, // 攻击/射击 (A, Xbox X)
          8: { 'value': 'k', 'value2': 'BUTTON_1' }, // 跳跃 (B, Xbox A)
          1: { 'value': 'l', 'value2': 'BUTTON_2' }, // 扔手榴弹 (C, Xbox B)
          10: { 'value': '', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        1: { // 玩家 2 (2P)
          4: { 'value': 'i', 'value2': 'DPAD_UP' },
          5: { 'value': 'm', 'value2': 'DPAD_DOWN' },
          6: { 'value': 'u', 'value2': 'DPAD_LEFT' },
          7: { 'value': 'o', 'value2': 'DPAD_RIGHT' },
          2: { 'value': 'y', 'value2': 'LEFT_TOP_SHOULDER' }, // 投币
          3: { 'value': 'p', 'value2': 'RIGHT_TOP_SHOULDER' }, // 开始
          0: { 'value': 'z', 'value2': 'BUTTON_3' }, // 攻击/射击
          8: { 'value': 'x', 'value2': 'BUTTON_1' }, // 跳跃
          1: { 'value': 'c', 'value2': 'BUTTON_2' }, // 手榴弹
          10: { 'value': '', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        2: {},
        3: {}
      };
    } else {
      // 恐龙快打及其他街机/通用游戏
      window.EJS_defaultControls = {
        0: { // 玩家 1 (1P)
          0: { 'value': 'j', 'value2': 'BUTTON_3' }, // 攻击拳 (B in Arcade, Xbox X)
          8: { 'value': 'k', 'value2': 'BUTTON_1' }, // 跳跃 (A in Arcade, Xbox A)
          1: { 'value': 'l', 'value2': 'BUTTON_2' }, // 第三键/大招 (Y in Arcade, Xbox B)
          9: { 'value': 'u', 'value2': 'BUTTON_4' }, // 第四键 (X in Arcade, Xbox Y)
          2: { 'value': 'shift', 'value2': 'LEFT_TOP_SHOULDER' }, // 投币映射为肩键 LB/L1
          3: { 'value': 'enter', 'value2': 'RIGHT_TOP_SHOULDER' }, // 开始映射为肩键 RB/R1
          4: { 'value': 'w', 'value2': 'DPAD_UP' }, // D-pad 上
          5: { 'value': 's', 'value2': 'DPAD_DOWN' }, // D-pad 下
          6: { 'value': 'a', 'value2': 'DPAD_LEFT' }, // D-pad 左
          7: { 'value': 'd', 'value2': 'DPAD_RIGHT' }, // D-pad 右
          10: { 'value': '', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        1: { // 玩家 2 (2P)
          4: { 'value': 'i', 'value2': 'DPAD_UP' },
          5: { 'value': 'm', 'value2': 'DPAD_DOWN' },
          6: { 'value': 'u', 'value2': 'DPAD_LEFT' },
          7: { 'value': 'o', 'value2': 'DPAD_RIGHT' },
          0: { 'value': 'z', 'value2': 'BUTTON_3' }, // 攻击拳
          8: { 'value': 'x', 'value2': 'BUTTON_1' }, // 跳跃
          1: { 'value': 'c', 'value2': 'BUTTON_2' }, // 第三键
          9: { 'value': 'v', 'value2': 'BUTTON_4' }, // 第四键
          2: { 'value': 'c', 'value2': 'LEFT_TOP_SHOULDER' }, // 投币
          3: { 'value': 'v', 'value2': 'RIGHT_TOP_SHOULDER' }, // 开始
          10: { 'value': '', 'value2': 'LEFT_BOTTOM_SHOULDER' },
          11: { 'value': '', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
          16: { 'value': '', 'value2': 'LEFT_STICK_X:+1' },
          17: { 'value': '', 'value2': 'LEFT_STICK_X:-1' },
          18: { 'value': '', 'value2': 'LEFT_STICK_Y:+1' },
          19: { 'value': '', 'value2': 'LEFT_STICK_Y:-1' }
        },
        2: {},
        3: {}
      };
    }

    // 底层物理按键 -> 虚拟按键翻译层映射表
    let p2KeyMap = {};
    if (gameLower.includes('pokemon') || gameLower.includes('gba') || core === 'mgba') {
      p2KeyMap = {
        'ArrowUp': { key: 'i', code: 'KeyI', keyCode: 73 },
        'ArrowDown': { key: 'm', code: 'KeyM', keyCode: 77 },
        'ArrowLeft': { key: 'u', code: 'KeyU', keyCode: 85 },
        'ArrowRight': { key: 'o', code: 'KeyO', keyCode: 79 },
        'Numpad1': { key: 'z', code: 'KeyZ', keyCode: 90 }, // A 键 (确认/对话)
        'Numpad2': { key: 'x', code: 'KeyX', keyCode: 88 }, // B 键 (取消/跑步)
        'Numpad4': { key: 'y', code: 'KeyY', keyCode: 89 }, // Select
        'Numpad5': { key: 'p', code: 'KeyP', keyCode: 80 }  // Start
      };
    } else if (gameLower.includes('kof97') || gameLower.includes('kof98')) {
      p2KeyMap = {
        'ArrowUp': { key: 'i', code: 'KeyI', keyCode: 73 },
        'ArrowDown': { key: 'm', code: 'KeyM', keyCode: 77 },
        'ArrowLeft': { key: 'u', code: 'KeyU', keyCode: 85 },
        'ArrowRight': { key: 'o', code: 'KeyO', keyCode: 79 },
        'Numpad1': { key: 'z', code: 'KeyZ', keyCode: 90 }, // A (轻拳)
        'Numpad2': { key: 'x', code: 'KeyX', keyCode: 88 }, // B (轻脚)
        'Numpad4': { key: 'c', code: 'KeyC', keyCode: 67 }, // C (重拳)
        'Numpad5': { key: 'v', code: 'KeyV', keyCode: 86 }, // D (重脚)
        'Numpad7': { key: 'y', code: 'KeyY', keyCode: 89 }, // 投币
        'Numpad8': { key: 'p', code: 'KeyP', keyCode: 80 }, // 开始
        // 同时也支持主键盘数字键映射作为备用
        'Digit1': { key: 'z', code: 'KeyZ', keyCode: 90 },
        'Digit2': { key: 'x', code: 'KeyX', keyCode: 88 },
        'Digit4': { key: 'c', code: 'KeyC', keyCode: 67 },
        'Digit5': { key: 'v', code: 'KeyV', keyCode: 86 }
      };
    } else if (gameLower.includes('mslug')) {
      p2KeyMap = {
        'ArrowUp': { key: 'i', code: 'KeyI', keyCode: 73 },
        'ArrowDown': { key: 'm', code: 'KeyM', keyCode: 77 },
        'ArrowLeft': { key: 'u', code: 'KeyU', keyCode: 85 },
        'ArrowRight': { key: 'o', code: 'KeyO', keyCode: 79 },
        'Numpad1': { key: 'z', code: 'KeyZ', keyCode: 90 }, // 攻击
        'Numpad2': { key: 'x', code: 'KeyX', keyCode: 88 }, // 跳跃
        'Numpad3': { key: 'c', code: 'KeyC', keyCode: 67 }, // 扔手榴弹
        'Numpad4': { key: 'y', code: 'KeyY', keyCode: 89 }, // 投币
        'Numpad5': { key: 'p', code: 'KeyP', keyCode: 80 }, // 开始
        // 同时也支持主键盘数字键映射作为备用
        'Digit1': { key: 'z', code: 'KeyZ', keyCode: 90 },
        'Digit2': { key: 'x', code: 'KeyX', keyCode: 88 },
        'Digit3': { key: 'c', code: 'KeyC', keyCode: 67 }
      };
    } else {
      // 恐龙快打 (固定不变)
      p2KeyMap = {
        'ArrowUp': { key: 'i', code: 'KeyI', keyCode: 73 },
        'ArrowDown': { key: 'm', code: 'KeyM', keyCode: 77 },
        'ArrowLeft': { key: 'u', code: 'KeyU', keyCode: 85 },
        'ArrowRight': { key: 'o', code: 'KeyO', keyCode: 79 },
        'Numpad1': { key: 'z', code: 'KeyZ', keyCode: 90 },
        'Numpad2': { key: 'x', code: 'KeyX', keyCode: 88 },
        'Numpad4': { key: 'c', code: 'KeyC', keyCode: 67 },
        'Numpad5': { key: 'v', code: 'KeyV', keyCode: 86 },
        // 同时也支持主键盘数字键映射作为备用
        'Digit1': { key: 'z', code: 'KeyZ', keyCode: 90 },
        'Digit2': { key: 'x', code: 'KeyX', keyCode: 88 }
      };
    }

    // 合金弹头长按连射逻辑的定时器状态维护
    const mslugIntervals = {};

    // 监听外接手柄配置并定时对齐底层 EmulatorJS 玩家映射
    window.__controlConfig = {
      connectedGamepadsCount: 0,
      singleGamepadPlayer: 1,
      keyboardLayoutForNoPad: 'layout2',
      isGamepadSwapped: false
    };

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'UPDATE_CONTROL_CONFIG') {
        window.__controlConfig = e.data.config || window.__controlConfig;
        syncGamepadSelection();
      }
    });

    function syncGamepadSelection() {
      const emu = window.EJS_emulator;
      if (!emu || !emu.gamepad || !emu.gamepadSelection) return;
      const gamepads = (emu.gamepad.gamepads || []).filter(g => g && g.id);
      if (gamepads.length === 0) return;

      const cfg = window.__controlConfig || {};
      if (gamepads.length === 1) {
        const key0 = gamepads[0].id + "_" + gamepads[0].index;
        if (cfg.singleGamepadPlayer === 2) {
          if (emu.gamepadSelection[0] !== "" || emu.gamepadSelection[1] !== key0) {
            emu.gamepadSelection[0] = "";
            emu.gamepadSelection[1] = key0;
          }
        } else {
          if (emu.gamepadSelection[0] !== key0 || emu.gamepadSelection[1] !== "") {
            emu.gamepadSelection[0] = key0;
            emu.gamepadSelection[1] = "";
          }
        }
      } else if (gamepads.length >= 2) {
        const key0 = gamepads[0].id + "_" + gamepads[0].index;
        const key1 = gamepads[1].id + "_" + gamepads[1].index;
        if (cfg.isGamepadSwapped) {
          if (emu.gamepadSelection[0] !== key1 || emu.gamepadSelection[1] !== key0) {
            emu.gamepadSelection[0] = key1;
            emu.gamepadSelection[1] = key0;
          }
        } else {
          if (emu.gamepadSelection[0] !== key0 || emu.gamepadSelection[1] !== key1) {
            emu.gamepadSelection[0] = key0;
            emu.gamepadSelection[1] = key1;
          }
        }
      }
      if (typeof emu.updateGamepadLabels === 'function') {
        try { emu.updateGamepadLabels(); } catch(e) {}
      }

      // 增强型底层手柄动作拦截保障机制，预先同步索引引用并智能分辨标准/非标准手柄
      if (!emu.__wrappedGamepadHook && emu.gamepad && typeof emu.gamepadEvent === 'function') {
        emu.__wrappedGamepadHook = true;
        const origGamepadEvent = emu.gamepadEvent.bind(emu);
        emu.gamepadEvent = function(t) {
          const pads = (emu.gamepad.gamepads || []).filter(g => g && g.id);
          let targetPlayer = 0;
          const cfg = window.__controlConfig || {};
          if (pads.length === 1) {
            targetPlayer = cfg.singleGamepadPlayer === 2 ? 1 : 0;
          } else if (pads.length >= 2) {
            const idx = pads.findIndex(g => g && g.index === t.gamepadIndex);
            if (idx === 0) targetPlayer = cfg.isGamepadSwapped ? 1 : 0;
            else if (idx === 1) targetPlayer = cfg.isGamepadSwapped ? 0 : 1;
          }

          const curPadObj = (emu.gamepad.gamepads || []).find(g => g && g.index === t.gamepadIndex) || pads[0];
          if (curPadObj && curPadObj.id) {
            const padKey = curPadObj.id + "_" + curPadObj.index;
            if (!emu.gamepad.gamepads[t.gamepadIndex]) {
              emu.gamepad.gamepads[t.gamepadIndex] = curPadObj;
            }
            if (emu.gamepadSelection[targetPlayer] !== padKey) {
              emu.gamepadSelection[targetPlayer] = padKey;
            }
          }

          origGamepadEvent(t);
          if (!t || !emu.started || (emu.isPopupOpen && emu.isPopupOpen()) || (emu.settingsMenu && emu.settingsMenu.style.display !== 'none')) return;
          if (t.type !== 'buttondown' && t.type !== 'buttonup' && t.type !== 'axischanged') return;

          const val = (t.type === 'buttonup' || (t.type === 'axischanged' && Math.abs(t.value || 0) < 0.5)) ? 0 : 32767;
          const lbl = t.label || '';
          const padIdUpper = (curPadObj && curPadObj.id) ? curPadObj.id.toUpperCase() : '';
          const isStandardLayout = padIdUpper.includes('STANDARD') || padIdUpper.includes('XINPUT') || padIdUpper.includes('XBOX') || padIdUpper.includes('PRO CONTROLLER') || padIdUpper.includes('DUALSENSE') || padIdUpper.includes('DUALSHOCK');

          // 为不同类型游戏匹配物理按钮触发
          if (gameLower.includes('pokemon') || gameLower.includes('gba') || core === 'mgba') {
            // GBA: 标准手柄肩键 LT/L2 触发 Select(2)，RT/R2 触发 Start(3)
            if (lbl === 'SELECT' || t.index === 8 || (isStandardLayout && (lbl === 'LEFT_BOTTOM_SHOULDER' || t.index === 6))) {
              emu.gameManager.simulateInput(targetPlayer, 2, val);
            }
            if (lbl === 'START' || t.index === 9 || (isStandardLayout && (lbl === 'RIGHT_BOTTOM_SHOULDER' || t.index === 7))) {
              emu.gameManager.simulateInput(targetPlayer, 3, val);
            }
          } else {
            // 街机系列: 标准手柄肩键 LB/L1 触发投币/Select(2)，RB/R1 触发开始/Start(3)
            // 针对非标准 Generic 手柄（如 Vendor: 0079 Product: 181c 等），其物理 X/动作键在索引 4 上，仅由内置映射或 Select 键触发投币
            if (lbl === 'SELECT' || t.index === 8 || (isStandardLayout && (lbl === 'LEFT_TOP_SHOULDER' || lbl === 'LEFT_BOTTOM_SHOULDER' || t.index === 4 || t.index === 6))) {
              emu.gameManager.simulateInput(targetPlayer, 2, val);
            }
            if (lbl === 'START' || t.index === 9 || (isStandardLayout && (lbl === 'RIGHT_TOP_SHOULDER' || lbl === 'RIGHT_BOTTOM_SHOULDER' || t.index === 5 || t.index === 7))) {
              emu.gameManager.simulateInput(targetPlayer, 3, val);
            }
          }
        };
      }
    }
    setInterval(syncGamepadSelection, 100);

    // 1P 常规物理键转 2P 虚拟键映射（当单手柄在1P而2P指定使用 layout1 时）
    const p1ToP2KeyMap = {
      'KeyW': { key: 'i', code: 'KeyI', keyCode: 73 },
      'KeyS': { key: 'm', code: 'KeyM', keyCode: 77 },
      'KeyA': { key: 'u', code: 'KeyU', keyCode: 85 },
      'KeyD': { key: 'o', code: 'KeyO', keyCode: 79 },
      'KeyJ': { key: 'z', code: 'KeyZ', keyCode: 90 },
      'KeyK': { key: 'x', code: 'KeyX', keyCode: 88 },
      'KeyL': { key: 'c', code: 'KeyC', keyCode: 67 },
      'KeyU': { key: 'z', code: 'KeyZ', keyCode: 90 },
      'KeyI': { key: 'x', code: 'KeyX', keyCode: 88 },
      'ShiftLeft': { key: 'y', code: 'KeyY', keyCode: 89 },
      'ShiftRight': { key: 'y', code: 'KeyY', keyCode: 89 },
      'Enter': { key: 'p', code: 'KeyP', keyCode: 80 }
    };

    // 2P 常规物理键转 1P 虚拟键映射（当单手柄在2P而1P指定使用 layout2 时）
    const p2ToP1KeyMap = {
      'ArrowUp': { key: 'w', code: 'KeyW', keyCode: 87 },
      'ArrowDown': { key: 's', code: 'KeyS', keyCode: 83 },
      'ArrowLeft': { key: 'a', code: 'KeyA', keyCode: 65 },
      'ArrowRight': { key: 'd', code: 'KeyD', keyCode: 68 },
      'Numpad1': { key: 'j', code: 'KeyJ', keyCode: 74 },
      'Numpad2': { key: 'k', code: 'KeyK', keyCode: 75 },
      'Numpad3': { key: 'l', code: 'KeyL', keyCode: 76 },
      'Numpad4': { key: 'shift', code: 'ShiftLeft', keyCode: 16 },
      'Numpad5': { key: 'enter', code: 'Enter', keyCode: 13 },
      'Digit1': { key: 'j', code: 'KeyJ', keyCode: 74 },
      'Digit2': { key: 'k', code: 'KeyK', keyCode: 75 },
      'Digit3': { key: 'l', code: 'KeyL', keyCode: 76 }
    };

    const handleKeyboardEvent = (e) => {
      // 如果是我们自己派发的模拟事件，直接跳过不作二次翻译，避免死循环
      if (e.simulated) return;

      const cfg = window.__controlConfig || {};
      // 如果接了1个外接手柄，且针对无手柄玩家自定义了键盘操作习惯路由
      if (cfg.connectedGamepadsCount === 1) {
        if (cfg.singleGamepadPlayer === 1 && cfg.keyboardLayoutForNoPad === 'layout1') {
          // 手柄控制了1P，2P玩家无手柄并且选择了 WASD+JKLUI 操控
          const targetKey = p1ToP2KeyMap[e.code];
          if (targetKey) {
            e.preventDefault();
            e.stopPropagation();
            const simulatedEvent = new KeyboardEvent(e.type, {
              key: targetKey.key, code: targetKey.code, keyCode: targetKey.keyCode, which: targetKey.keyCode,
              bubbles: true, cancelable: true, view: window
            });
            Object.defineProperty(simulatedEvent, 'simulated', { value: true });
            (e.target || window).dispatchEvent(simulatedEvent);
            return;
          }
        } else if (cfg.singleGamepadPlayer === 2 && cfg.keyboardLayoutForNoPad === 'layout2') {
          // 手柄控制了2P，1P玩家无手柄并且选择了 ↑↓←→+小键盘 操控
          const targetKey = p2ToP1KeyMap[e.code];
          if (targetKey) {
            e.preventDefault();
            e.stopPropagation();
            const simulatedEvent = new KeyboardEvent(e.type, {
              key: targetKey.key, code: targetKey.code, keyCode: targetKey.keyCode, which: targetKey.keyCode,
              bubbles: true, cancelable: true, view: window
            });
            Object.defineProperty(simulatedEvent, 'simulated', { value: true });
            (e.target || window).dispatchEvent(simulatedEvent);
            return;
          }
        }
      }

      const isMslug = gameLower.includes('mslug');

      // 合金弹头连射劫持 (1P 射击: KeyJ, 2P 射击: Numpad1 或 Digit1)
      if (isMslug && (e.code === 'KeyJ' || e.code === 'Numpad1' || e.code === 'Digit1')) {
        if (e.type === 'keydown') {
          // 如果已经在连按中，直接阻止原物理键的自重复触发
          if (mslugIntervals[e.code]) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }

          e.preventDefault();
          e.stopPropagation();

          // 1P 映射为 'j'，2P 映射为 'z' (虚拟键)
          const targetKeyInfo = e.code === 'KeyJ'
            ? { key: 'j', code: 'KeyJ', keyCode: 74 }
            : { key: 'z', code: 'KeyZ', keyCode: 90 };

          let state = false; // false -> keyup, true -> keydown
          
          // 首次立即按下一发子弹
          const firstEvent = new KeyboardEvent('keydown', {
            key: targetKeyInfo.key,
            code: targetKeyInfo.code,
            keyCode: targetKeyInfo.keyCode,
            which: targetKeyInfo.keyCode,
            bubbles: true,
            cancelable: true,
            view: window
          });
          Object.defineProperty(firstEvent, 'simulated', { value: true });
          (e.target || window).dispatchEvent(firstEvent);
          state = true;

          // 每 70 毫秒交替发送按下与抬起事件，实现顺滑且稳定的连发效果
          mslugIntervals[e.code] = setInterval(() => {
            const type = state ? 'keyup' : 'keydown';
            const simulatedEvent = new KeyboardEvent(type, {
              key: targetKeyInfo.key,
              code: targetKeyInfo.code,
              keyCode: targetKeyInfo.keyCode,
              which: targetKeyInfo.keyCode,
              bubbles: true,
              cancelable: true,
              view: window
            });
            Object.defineProperty(simulatedEvent, 'simulated', { value: true });
            (e.target || window).dispatchEvent(simulatedEvent);
            state = !state;
          }, 70);
        } else if (e.type === 'keyup') {
          if (mslugIntervals[e.code]) {
            clearInterval(mslugIntervals[e.code]);
            delete mslugIntervals[e.code];

            e.preventDefault();
            e.stopPropagation();

            // 发送最终的 keyup 释放事件
            const targetKeyInfo = e.code === 'KeyJ'
              ? { key: 'j', code: 'KeyJ', keyCode: 74 }
              : { key: 'z', code: 'KeyZ', keyCode: 90 };

            const finalEvent = new KeyboardEvent('keyup', {
              key: targetKeyInfo.key,
              code: targetKeyInfo.code,
              keyCode: targetKeyInfo.keyCode,
              which: targetKeyInfo.keyCode,
              bubbles: true,
              cancelable: true,
              view: window
            });
            Object.defineProperty(finalEvent, 'simulated', { value: true });
            (e.target || window).dispatchEvent(finalEvent);
          }
        }
        return;
      }

      const targetKey = p2KeyMap[e.code];
      if (targetKey) {
        // 阻止原物理按键的默认行为与事件传播，使得模拟器只看到我们伪造的虚拟按键
        e.preventDefault();
        e.stopPropagation();

        // 构造虚拟键盘事件
        const simulatedEvent = new KeyboardEvent(e.type, {
          key: targetKey.key,
          code: targetKey.code,
          keyCode: targetKey.keyCode,
          which: targetKey.keyCode,
          bubbles: true,
          cancelable: true,
          view: window
        });

        // 在事件对象上附加一个属性，标记为已模拟
        Object.defineProperty(simulatedEvent, 'simulated', { value: true });

        // 将伪造事件分发到相同的事件目标上
        (e.target || window).dispatchEvent(simulatedEvent);
      }
    };

    // 在捕获阶段注册事件，确保在 EmulatorJS 的所有事件监听器运行之前，我们已经完成了按键拦截和翻译
    window.addEventListener('keydown', handleKeyboardEvent, true);
    window.addEventListener('keyup', handleKeyboardEvent, true);

    // 辅助调试日志，方便在控制台确认按键触发与翻译状态
    window.addEventListener('keydown', (e) => {
      console.log('[街机按键调试] key:', e.key, 'code:', e.code, 'keyCode:', e.keyCode, 'simulated:', !!e.simulated);
    }, true);
  </script>
  <script src="/emulatorjs/loader.js"></script>
</body>
</html>
